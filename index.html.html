<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasımpatı 🌼</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b1a; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .yazi {
    position: fixed; left: 0; right: 0; top: 24px; text-align: center;
    font-family: Georgia, "Times New Roman", serif; color: #f6e7ff;
    letter-spacing: 2px; pointer-events: none; text-shadow: 0 0 18px #c06bff88;
  }
  .yazi h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); font-weight: normal; }
  .yazi p  { margin: 6px 0 0; font-size: 15px; opacity: .7; }
</style>
</head>
<body>
<div class="yazi">
  <h1>Kasımpatı</h1>
  <p>Çiçekleri yeniden açtırmak için ekrana tıkla</p>
</div>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
let W, H, dpr;

function boyutla() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', boyutla);
boyutla();

// Çiçekler: konum (ekran oranı), büyüklük, renk tonu (hue) aralığı
const cicekler = [
  { xr: 0.50, yr: 0.50, r: 1.00, h1: 300, h2: 330, ph: 0.0, gecikme: 0.0 }, // mor-pembe
  { xr: 0.22, yr: 0.62, r: 0.70, h1: 38,  h2: 52,  ph: 1.7, gecikme: 0.6 }, // altın sarı
  { xr: 0.78, yr: 0.60, r: 0.75, h1: 8,   h2: 28,  ph: 3.1, gecikme: 1.1 }, // turuncu-kızıl
];

let baslangic = performance.now();
const kolay = t => 1 - Math.pow(1 - t, 3);
const sinirla = v => Math.max(0, Math.min(1, v));

// Tek bir taç yaprağı: (0,0)'dan yukarı doğru uzanan ince, uzun yaprak
function yaprak(boy, en) {
  x.beginPath();
  x.moveTo(0, 0);
  x.bezierCurveTo(en, -boy * 0.35, en * 0.8, -boy * 0.85, 0, -boy);
  x.bezierCurveTo(-en * 0.8, -boy * 0.85, -en, -boy * 0.35, 0, 0);
  x.fill();
  x.stroke();
}

function sap(f, bx, by, hx, hy, t) {
  x.strokeStyle = '#2f7a3a';
  x.lineWidth = 7 * f.olcek;
  x.lineCap = 'round';
  x.beginPath();
  x.moveTo(bx, by);
  x.quadraticCurveTo(bx + (hx - bx) * 0.2, (by + hy) / 2, hx, hy);
  x.stroke();
  for (const [k, yon] of [[0.45, 1], [0.7, -1]]) {
    const lx = bx + (hx - bx) * k * 0.6, ly = by + (hy - by) * k;
    x.save();
    x.translate(lx, ly);
    x.rotate(yon * (0.9 + Math.sin(t * 1.3 + f.ph + k * 4) * 0.12));
    x.fillStyle = '#3b8f45';
    x.strokeStyle = '#25602d';
    x.lineWidth = 1.2;
    yaprak(60 * f.olcek, 18 * f.olcek);
    x.restore();
  }
}

function cicekCiz(f, t) {
  const S = Math.min(W, H);
  f.olcek = S / 800 * f.r;
  const R = 170 * f.olcek;
  const acilma = kolay(sinirla((t - f.gecikme) / 3.5));
  const salinim = Math.sin(t * 0.9 + f.ph) * 0.06;

  const bx = W * f.xr, by = H + 10;
  const sapBoy = by - H * f.yr;
  const hx = bx + Math.sin(salinim) * sapBoy * 0.9;
  const hy = H * f.yr + (1 - Math.cos(salinim)) * sapBoy;

  sap(f, bx, by, hx, hy, t);

  x.save();
  x.translate(hx, hy);
  x.rotate(salinim * 1.5);

  // arka ışıltı
  const g = x.createRadialGradient(0, 0, 0, 0, 0, R * 1.6);
  g.addColorStop(0, `hsla(${f.h1},90%,70%,${0.25 * acilma})`);
  g.addColorStop(1, 'hsla(0,0%,0%,0)');
  x.fillStyle = g;
  x.beginPath(); x.arc(0, 0, R * 1.6, 0, Math.PI * 2); x.fill();

  const KATMAN = 16;
  for (let l = 0; l < KATMAN; l++) {
    const k = l / (KATMAN - 1);                  // 0 = dış, 1 = iç
    const katAcilma = kolay(sinirla((acilma - (1 - k) * 0.45) / 0.55));
    if (katAcilma <= 0) continue;
    const adet = Math.round(30 - k * 16);
    const boy = R * (1 - k * 0.82) * (0.25 + 0.75 * katAcilma);
    const en = boy * 0.13 + 2.5 * f.olcek;
    const hue = f.h1 + (f.h2 - f.h1) * k;
    const isik = 38 + k * 34;
    x.fillStyle = `hsl(${hue},${75 + k * 15}%,${isik}%)`;
    x.strokeStyle = `hsla(${hue},70%,${isik - 18}%,0.6)`;
    x.lineWidth = 0.8;
    const donus = l * 0.41 + t * 0.04 * (l % 2 ? 1 : -1);
    for (let p = 0; p < adet; p++) {
      const a = (p / adet) * Math.PI * 2 + donus;
      const nefes = 1 + Math.sin(t * 2.2 + p * 0.9 + l) * 0.035;
      x.save();
      x.rotate(a);
      yaprak(boy * nefes, en);
      x.restore();
    }
  }

  // göbek
  const gR = R * 0.13 * (0.4 + 0.6 * acilma);
  const gg = x.createRadialGradient(0, 0, 0, 0, 0, gR);
  gg.addColorStop(0, '#fff6b0');
  gg.addColorStop(0.6, `hsl(${f.h2 + 20},90%,60%)`);
  gg.addColorStop(1, `hsl(${f.h2},80%,40%)`);
  x.fillStyle = gg;
  x.beginPath(); x.arc(0, 0, gR, 0, Math.PI * 2); x.fill();

  x.restore();
  f.hx = hx; f.hy = hy;
}

// Düşen yapraklar
const dusenler = [];
function yeniDusen(f, rastgeleY) {
  const hue = f.h1 + Math.random() * (f.h2 - f.h1);
  return {
    x: (f.hx ?? W * f.xr) + (Math.random() - 0.5) * 120,
    y: rastgeleY ? Math.random() * H : (f.hy ?? H * f.yr),
    vy: 0.4 + Math.random() * 0.9,
    vx: (Math.random() - 0.5) * 0.5,
    a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.05,
    boy: 10 + Math.random() * 12,
    renk: `hsla(${hue},85%,${50 + Math.random() * 20}%,0.85)`,
    ph: Math.random() * 6.28,
  };
}
for (let i = 0; i < 40; i++) dusenler.push(yeniDusen(cicekler[i % 3], true));

function dusenCiz(t) {
  for (let i = 0; i < dusenler.length; i++) {
    const d = dusenler[i];
    d.y += d.vy;
    d.x += d.vx + Math.sin(t * 1.5 + d.ph) * 0.6;
    d.a += d.va;
    if (d.y > H + 30) dusenler[i] = yeniDusen(cicekler[i % 3], false);
    x.save();
    x.translate(d.x, d.y);
    x.rotate(d.a);
    x.scale(1, 0.6 + 0.4 * Math.sin(t * 3 + d.ph));
    x.fillStyle = d.renk;
    x.strokeStyle = 'rgba(0,0,0,0.15)';
    x.lineWidth = 0.5;
    yaprak(d.boy, d.boy * 0.22);
    x.restore();
  }
}

// Yıldızlar
const yildizlar = Array.from({ length: 120 }, () => ({
  x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.4 + 0.3, ph: Math.random() * 6.28,
}));

function arkaPlan(t) {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0b1a');
  g.addColorStop(0.6, '#221538');
  g.addColorStop(1, '#3a1f3f');
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
  for (const s of yildizlar) {
    x.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(t * 2 + s.ph)})`;
    x.beginPath(); x.arc(s.x * W, s.y * H, s.r, 0, 6.28); x.fill();
  }
}

function kare(simdi) {
  const t = (simdi - baslangic) / 1000;
  arkaPlan(t);
  cicekCiz(cicekler[1], t);
  cicekCiz(cicekler[2], t);
  cicekCiz(cicekler[0], t);
  dusenCiz(t);
  requestAnimationFrame(kare);
}
requestAnimationFrame(kare);

c.addEventListener('click', () => {
  baslangic = performance.now();
  for (let i = 0; i < 25; i++) dusenler.push(yeniDusen(cicekler[i % 3], false));
  if (dusenler.length > 120) dusenler.splice(0, dusenler.length - 120);
});
</script>
</body>
</html>
